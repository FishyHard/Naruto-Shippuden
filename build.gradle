// Forwards to the NeoForge 26.3 port in neoforge/ (an included build): `./gradlew build` builds it and copies the jar to
// build/libs here too, `./gradlew runClient` starts the dev client. See settings.gradle.
def port = gradle.includedBuild('neoforge')

tasks.register('copyJar', Sync) {
    dependsOn port.task(':build')
    from 'neoforge/build/libs'
    into layout.buildDirectory.dir('libs')
}

tasks.register('build') {
    group = 'build'
    description = 'Builds the NeoForge 26.3 mod jar (neoforge/build/libs, copied to build/libs).'
    dependsOn 'copyJar'
}

tasks.register('clean', Delete) {
    group = 'build'
    dependsOn port.task(':clean')
    delete layout.buildDirectory
}

['jar', 'compileJava', 'runClient', 'runServer'].each { name ->
    tasks.register(name) {
        group = 'port'
        dependsOn port.task(':' + name)
    }
}
